<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo using Vanilla JS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css">
</head>
<body>
    <div class="container">
        <div class="box has-text-centered">
            <div class="title">Simple Todo List</div>
            <div class="subtitle">Fun things to do</div>
        </div>
        <div class="section box">
            <div class="field is-horizontal">
                <div class="field-label is-normal">
                    <label class="label">What should I do?</label>
                </div>
                <div class="field-body">
                    <div class="field">
                        <p class="control">
                            <input type="text" class="input" placeholder="Type something">
                        </p>
                    </div>
                    <button class="button">Add Todo</button>
                </div>
            </div>
        </div>
        <div class="section box">
        </div>
    </div>
   <script src="todo.js" type="text/javascript"></script>
</body>
</html>
